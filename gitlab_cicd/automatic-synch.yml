next-major-sync:
  stage: .post
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^v[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"
      allow_failure: true
  variables:
    # CI_JOB_TOKEN can read MRs, but cannot create or merge them.
    GLAB_ENABLE_CI_AUTOLOGIN: "false"
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
    - wget https://gitlab.com/gitlab-org/cli/-/releases/v1.115.0/downloads/glab_1.115.0_linux_amd64.apk
    - apk add --no-cache --allow-untrusted glab_1.115.0_linux_amd64.apk
    - test -n "$MERGE_REQUEST_ACCESS_TOKEN" || { echo "Missing required CI variable MERGE_REQUEST_ACCESS_TOKEN"; exit 1; }
    - glab auth login --hostname "$CI_SERVER_FQDN" --token "$MERGE_REQUEST_ACCESS_TOKEN" --api-protocol "$CI_SERVER_PROTOCOL"
  script:
    - |
      if [ $(( ${CI_COMMIT_BRANCH#v} + 1 )) -gt 7 ]; then
        target_branch=development
      else
        target_branch=v$(( ${CI_COMMIT_BRANCH#v} + 1 ))
      fi
    # The runner checkout contains the pushed ref, but not necessarily the
    # target branch that glab uses to populate --fill.
    - git fetch --no-tags origin "$target_branch:refs/remotes/origin/$target_branch"
    - GITLAB_HOST="$CI_SERVER_FQDN" glab mr create --source-branch "$CI_COMMIT_BRANCH" --target-branch "$target_branch" --yes --title "$CI_COMMIT_BRANCH synchronization."
    - |
      for attempt in 1 2 3 4 5 6; do
        if GITLAB_HOST="$CI_SERVER_FQDN" glab mr merge "$CI_COMMIT_BRANCH" --auto-merge --yes; then
          exit 0
        fi
        echo "Auto-merge is not ready; retrying in 10 seconds (attempt $attempt/6)"
        sleep 10
      done
      echo "Merge request was created, but auto-merge could not be enabled" >&2
      exit 1

sync-github-mirror:
  stage: .post
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PROJECT_NAME == "ear"
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      allow_failure: true
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  before_script:
    - apk add --no-cache git
    - apk add github-cli
  script:
    - if test -z "$GITHUB_MIRROR_REPOSITORY"; then echo "Missing required CI variable GITHUB_MIRROR_REPOSITORY"; exit 1; fi
    - if test -z "$GITHUB_MIRROR_TOKEN"; then echo "Missing required CI variable GITHUB_MIRROR_TOKEN"; exit 1; fi
    - git push "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/${GITHUB_MIRROR_REPOSITORY}.git" "HEAD:refs/heads/gitlab/${CI_COMMIT_BRANCH}"
    - echo "${GITHUB_MIRROR_TOKEN}" | gh auth login --with-token
    - head_branch="gitlab/${CI_COMMIT_BRANCH}"
    - base_branch="${CI_COMMIT_BRANCH}priv"
    - |
      if [ "$CI_COMMIT_BRANCH" == "development" ]; then
        base_branch=dev
      fi
    - git remote add -f --no-tags -t "$head_branch" -t "$base_branch" github https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/${GITHUB_MIRROR_REPOSITORY}.git
    - gh pr create --repo "$GITHUB_MIRROR_REPOSITORY" -B "$base_branch" -H "gitlab/${CI_COMMIT_BRANCH}" --body "Review commit list." --title "Gitlab's $CI_COMMIT_BRANCH synchronization."
