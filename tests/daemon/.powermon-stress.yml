.powermon-stress-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/daemon/Makefile
        - src/daemon/**/*
        - src/report/Makefile
        - src/report/**/*
        - src/management/Makefile
        - src/management/**/*
        - src/metrics/Makefile
        - src/metrics/**/*
        - src/common/Makefile
        - src/common/**/*
        - src/slurm_plugin/Makefile
        - src/slurm_plugin/**/*
        - src/daemon/remote_api/**/*
        - src/daemon/shared_configuration.*
        - src/global_manager/Makefile
        - src/global_manager/**/*
        - src/Makefile.depend
        - src/Makefile.extra
    - when: never

compile-delayed-energy-reading:
  stage: build
  extends: .powermon-stress-rules
  script:
    - export CC_FLAGS="-Wall -O2 -g -DDELAYED_RANDOM=1"
    - export MPICC_FLAGS="\$(CC_FLAGS)"
    - CONFIGURE_FLAGS="--prefix=$PWD/ear-delayed-random --disable-mpi --disable-mpi-loader --without-slurm" $TESTDIR/compile.sh
    - make install
    - make etc.install
  artifacts:
    untracked: false
    when: on_success
    paths:
      - "ear-delayed-random"

compile-bt-s:
  extends: .powermon-stress-rules
  stage: build
  needs: []
  script:
    - $TESTDIR/scripts/compile_nas.sh $TESTDIR/apps/NPB3.4.3/NPB3.4-OMP bt S
    - cp -r $TESTDIR/apps/NPB3.4.3/NPB3.4-OMP/bin ./nas_bin
  artifacts:
    paths:
      - ./nas_bin/

powermon_stress:
  stage: test
  extends: .powermon-stress-rules
  needs: ["compile-delayed-energy-reading", "compile-bt-s"]
  variables:
    EAR_TMP: "/var/ear"
    N_STEPS: "10"
  script:
    - cp ear-delayed-random/etc/ear/ear.conf.full.template ear-delayed-random/etc/ear/ear.conf
    - tests/daemon/powermon_stress.sh ear-delayed-random ear-delayed-random/etc $EAR_TMP $N_STEPS ./nas_bin/bt.S.x 2> >(tee script.out)
  after_script:
    - mkdir ear_tmp
    - test -f /tmp/eard_journal.log && cp /tmp/eard_journal.log . || true
    - test -f /tmp/ear-dyn.conf && cp /tmp/ear-dyn.conf . || true
    - test -d /var/ear && cp -r /var/ear ear_tmp || true
  artifacts:
    name: logs
    when: always
    paths:
      - eard.out # The stdout/stderr of the eard, generated by the deploy_eard.sh script.
      - eard_journal.log
      - ear-dyn.conf
      - ear_tmp
      - script.out
